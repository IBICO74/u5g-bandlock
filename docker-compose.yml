services:
  u5g-bandlock:
    build: .
    # or: image: ghcr.io/ibico74/u5g-bandlock:latest
    container_name: u5g-bandlock
    restart: unless-stopped
    environment:
      MODEM_IP: 192.168.1.53
      ICCID: "8947000000000000000"
      LTE_BAND: "1,7,20,28"
      NR5G_SA_BAND: "1,3,28,78"
      INTERVAL: 900            # seconds between checks
      # Fetch the modem's SSH password live from the UniFi API (recommended):
      UNIFI_HOST: 192.168.1.1
      UNIFI_API_KEY: ${UNIFI_API_KEY}
      # …or hardcode the device SSH credentials instead:
      #MODEM_USER: xxxxx
      #MODEM_SSH_PASSWORD: xxxxx
